<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/other-textures/star.png">
    <title>A Little Light</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { 
            margin: 0; 
            overflow: hidden; /* Nasconde le barre di scorrimento */
            background-color: #000;
        }
        canvas { 
            display: block; 
        }
        @keyframes flash-button-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 14px rgba(255, 240, 180, 0.30); }
            50% { transform: scale(1.06); box-shadow: 0 0 24px rgba(255, 240, 180, 0.55); }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/",
                "@three.ez/instanced-mesh": "https://cdn.jsdelivr.net/npm/@three.ez/instanced-mesh/build/index.js",
                "bvh.js": "https://cdn.jsdelivr.net/npm/bvh.js/build/index.js"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
</head>
<body>
    <div id="title-screen" style="
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090909;
        color: #f2f1ff;
        font-family: 'VT323', monospace;
        letter-spacing: 0.08em;
    ">
        <div style="
            width: min(92vw, 520px);
            text-align: center;
        ">
            <div style="font-size: clamp(2.6rem, 7vw, 5rem); margin-bottom: 28px; line-height: 0.9;">A Little Light</div>

            <div style="display: flex; justify-content: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap;">
                <button id="music-toggle" style="
                    padding: 10px 18px;
                    border: 2px solid #d9d9d9;
                    background: transparent;
                    color: #f5f5f5;
                    cursor: pointer;
                    font: inherit;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    border-radius: 0;
                    box-shadow: 4px 4px 0 #5a5a5a;
                ">Music: Off</button>
            </div>

            <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
                <button id="start-story" style="
                    min-width: 200px;
                    padding: 14px 22px;
                    border: 2px solid #d9d9d9;
                    background: transparent;
                    color: #ffffff;
                    cursor: pointer;
                    font: inherit;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    border-radius: 0;
                    box-shadow: 4px 4px 0 #5a5a5a;
                ">Story Mode</button>

                <button id="start-graphics" style="
                    min-width: 200px;
                    padding: 14px 22px;
                    border: 2px solid #d9d9d9;
                    background: transparent;
                    color: #ffffff;
                    cursor: pointer;
                    font: inherit;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    border-radius: 0;
                    box-shadow: 4px 4px 0 #5a5a5a;
                ">Graphics Mode</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <div id="vignette-overlay" style="
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, rgba(0,0,0,0) 46%, rgba(0,0,0,0.72) 100%);
        opacity: 0.45;
        pointer-events: none;
        z-index: 15;
    "></div>
    <div id="story-blackout" style="
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 9;
    "></div>
    <div id="narrative-text" style="
        position: absolute; 
        bottom: 10%; 
        left: 10%; 
        right: 10%;
        color: white; 

        font-family: 'VT323', monospace; 
        font-size: 34px;
        font-style: bold;

        pointer-events: none; /* Impedisce al testo di bloccare i clic del mouse sul 3D */
        z-index: 10;
        text-align: center;
    "></div>

    <div id="tutorial-overlay" style="
        position: fixed;
        top: clamp(4vh, 8vh, 12vh);
        left: 50%;
        transform: translateX(-50%);
        max-width: min(92vw, 560px);
        padding: 16px 26px;
        background: rgba(9, 9, 9, 0.72);
        border: 2px solid rgba(217, 217, 217, 0.5);
        color: #f2f1ff;
        font-family: 'VT323', monospace;
        font-size: clamp(1.3rem, 4vw, 2rem);
        letter-spacing: 0.08em;
        text-align: center;
        line-height: 1.35;
        opacity: 0;
        pointer-events: none;
        z-index: 12;
    "></div>

    <button id="flash-button" aria-label="Twinkle the star" style="
        position: fixed;
        right: clamp(18px, 6vw, 42px);
        bottom: clamp(18px, 8vh, 48px);
        width: 76px;
        height: 76px;
        padding: 0;
        display: none;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(255, 255, 255, 0.55);
        border-radius: 50%;
        background: radial-gradient(circle at center, rgba(255, 244, 200, 0.22), rgba(255, 244, 200, 0.04) 70%, rgba(0, 0, 0, 0));
        color: #f5f5f5;
        cursor: pointer;
        z-index: 16;
        opacity: 0.9;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        animation: flash-button-pulse 2.4s ease-in-out infinite;
    ">
        <img src="./assets/other-textures/star.png" alt="" style="width: 60%; height: 60%; object-fit: contain; pointer-events: none; filter: drop-shadow(0 0 6px rgba(255, 240, 180, 0.8));">
    </button>
</body>
</html>
