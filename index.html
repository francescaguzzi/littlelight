<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/stella.png">
    <title>A Little Light</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        body { 
            margin: 0; 
            overflow: hidden; /* Nasconde le barre di scorrimento */
            background-color: #000;
        }
        canvas { 
            display: block; 
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/",
                "@three.ez/instanced-mesh": "https://cdn.jsdelivr.net/npm/@three.ez/instanced-mesh/build/index.js",
                "bvh.js": "https://cdn.jsdelivr.net/npm/bvh.js/build/index.js"
            }
        }
    </script>
</head>
<body>
    <div id="title-screen" style="
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090909;
        color: #f2f1ff;
        font-family: 'VT323', monospace;
        letter-spacing: 0.08em;
    ">
        <div style="
            width: min(92vw, 520px);
            text-align: center;
        ">
            <div style="font-size: clamp(2.6rem, 7vw, 5rem); margin-bottom: 28px; line-height: 0.9;">A Little Light</div>

            <div style="display: flex; justify-content: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap;">
                <button id="music-toggle" style="
                    padding: 10px 18px;
                    border: 2px solid #d9d9d9;
                    background: transparent;
                    color: #f5f5f5;
                    cursor: pointer;
                    font: inherit;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    border-radius: 0;
                    box-shadow: 4px 4px 0 #5a5a5a;
                ">Music: Off</button>
            </div>

            <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
                <button id="start-story" style="
                    min-width: 200px;
                    padding: 14px 22px;
                    border: 2px solid #d9d9d9;
                    background: transparent;
                    color: #ffffff;
                    cursor: pointer;
                    font: inherit;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    border-radius: 0;
                    box-shadow: 4px 4px 0 #5a5a5a;
                ">Story Mode</button>

                <button id="start-graphics" style="
                    min-width: 200px;
                    padding: 14px 22px;
                    border: 2px solid #d9d9d9;
                    background: transparent;
                    color: #ffffff;
                    cursor: pointer;
                    font: inherit;
                    letter-spacing: 0.08em;
                    text-transform: uppercase;
                    border-radius: 0;
                    box-shadow: 4px 4px 0 #5a5a5a;
                ">Graphics Mode</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
    <div id="story-blackout" style="
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 9;
    "></div>
    <div id="narrative-text" style="
        position: absolute; 
        bottom: 10%; 
        left: 10%; 
        right: 10%;
        color: white; 

        font-family: 'VT323', monospace; 
        font-size: 34px;
        font-style: bold;

        pointer-events: none; /* Impedisce al testo di bloccare i clic del mouse sul 3D */
        z-index: 10;
        text-align: center;
    "></div>
</body>
</html>
